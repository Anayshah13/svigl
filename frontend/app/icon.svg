<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Soft dark pad so the cube reads on light browser chrome -->
  <rect width="32" height="32" rx="8" fill="#1B1A2A"/>
  <!-- Soft ground shadow -->
  <ellipse cx="16" cy="24.5" rx="7" ry="1.6" fill="#000000" opacity="0.28"/>
  <!-- Isometric cube: top / left / right faces (Svigl chartreuse / green / plum) -->
  <path d="M16 7.2 L23.4 11.5 L16 15.8 L8.6 11.5 Z" fill="#BBE331"/>
  <path d="M8.6 11.5 L16 15.8 L16 24.4 L8.6 20.1 Z" fill="#10865C"/>
  <path d="M16 15.8 L23.4 11.5 L23.4 20.1 L16 24.4 Z" fill="#703F93"/>
  <!-- Subtle edge highlight on top face -->
  <path d="M16 7.2 L23.4 11.5 L16 15.8 L8.6 11.5 Z" fill="none" stroke="#D4F06A" stroke-width="0.4" opacity="0.55"/>
</svg>
